# Сборка и публикация на GitHub Pages при каждом изменении ветки main.
#
# Один раз в репозитории:
#   Settings -> Pages -> Source: GitHub Actions
#   Settings -> Secrets and variables -> Actions -> Variables -> New variable:
#     API_BASE_URL = адрес сервера (например, https://example.com/api).
#     Если переменную не задавать, приложение обращается к /api на своём сайте.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Новая публикация отменяет предыдущую, ещё не завершённую.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.6
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # --base-href: сайт живёт в подкаталоге /<имя репозитория>/.
      # --wasm: сборка WebAssembly; браузерам без поддержки достаётся обычный JS.
      - name: Build
        run: >
          flutter build web --release --wasm
          --base-href "/${{ github.event.repository.name }}/"
          --dart-define=API_BASE_URL=${{ vars.API_BASE_URL }}

      # Pages на неизвестный адрес отдаёт 404.html. Копия index.html вместо него
      # заставляет приложение открыть любой маршрут (глубокую ссылку) самостоятельно.
      - name: SPA fallback
        run: cp build/web/index.html build/web/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
